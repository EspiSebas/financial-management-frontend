<section class="page-heading"><div><p class="eyebrow">ORGANIZACIÓN</p><h1>Categorías</h1><p>Crea grupos para entender mejor en qué entra y sale tu dinero.</p></div></section>
<section class="layout">
  <form class="card form-card" (ngSubmit)="addCategory()"><h2>Nueva categoría</h2><label>Nombre<input name="name" [(ngModel)]="newCategory.name" placeholder="Ej. Transporte" required /></label><label>Tipo<select name="type" [(ngModel)]="newCategory.type"><option value="Gasto">Gasto</option><option value="Ingreso">Ingreso</option></select></label><label>Icono<input name="icon" [(ngModel)]="newCategory.icon" maxlength="2" placeholder="🚗" /></label><button type="submit">Agregar categoría</button></form>
  <div class="categories"><div class="section-title"><h2>Tus categorías</h2><span>{{ categories.length }} registradas</span></div><div class="category-list"><article *ngFor="let category of categories" class="category-row"><span class="icon">{{ category.icon }}</span><div><strong>{{ category.name }}</strong><small [class.income]="category.type === 'Ingreso'">{{ category.type }}</small></div><button type="button" (click)="removeCategory(category.id)" [attr.aria-label]="'Eliminar ' + category.name">Eliminar</button></article></div></div>
</section>
