<section class="page-heading">
  <div>
    <p class="eyebrow">ORGANIZACIÓN</p>
    <h1>Categorías</h1>
    <p>Organiza tus ingresos y gastos en categorías.</p>
  </div>
</section>

<section class="layout">
  <form class="card form-card" (ngSubmit)="addCategory()">
    <h2>Nueva categoría</h2>
    <label for="new-category-name">Nombre</label>
    <input id="new-category-name" name="name" [(ngModel)]="newCategory.name"
      placeholder="Ej. Transporte" maxlength="100" required />

    <label for="new-category-type">Tipo</label>
    <select id="new-category-type" name="type" [(ngModel)]="newCategory.type">
      <option value="Gasto">Gasto</option>
      <option value="Ingreso">Ingreso</option>
    </select>

    <button type="submit" [disabled]="saving">{{ saving ? 'Guardando…' : 'Agregar categoría' }}</button>
  </form>

  <section class="categories" aria-labelledby="categories-title">
    <div class="section-title">
      <h2 id="categories-title">Tus categorías</h2>
      <span>{{ categories.length }} registradas</span>
    </div>

    <p class="message error" *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>
    <p class="message" *ngIf="loading" role="status">Cargando categorías…</p>

    <div class="table-wrap" *ngIf="!loading">
      <table>
        <thead>
          <tr><th scope="col">Nombre</th><th scope="col">Tipo</th><th scope="col">Acciones</th></tr>
        </thead>
        <tbody>
          <tr *ngFor="let category of categories">
            <ng-container *ngIf="editingId !== category.id; else editRow">
              <td>{{ category.name }}</td>
              <td><span class="type-badge" [class.income]="category.type === 'Ingreso'">{{ category.type }}</span></td>
              <td class="actions">
                <button class="edit-button" type="button" (click)="startEditing(category)" [disabled]="saving">Modificar</button>
                <button class="delete-button" type="button" (click)="removeCategory(category)" [disabled]="saving">Eliminar</button>
              </td>
            </ng-container>
            <ng-template #editRow>
              <td><input class="table-input" [attr.aria-label]="'Nombre de ' + category.name"
                [(ngModel)]="editingCategory.name" [ngModelOptions]="{standalone: true}" maxlength="100" required /></td>
              <td>
                <select class="table-input" [attr.aria-label]="'Tipo de ' + category.name"
                  [(ngModel)]="editingCategory.type" [ngModelOptions]="{standalone: true}">
                  <option value="Gasto">Gasto</option><option value="Ingreso">Ingreso</option>
                </select>
              </td>
              <td class="actions">
                <button class="save-button" type="button" (click)="saveCategory(category.id)" [disabled]="saving">Guardar</button>
                <button class="cancel-button" type="button" (click)="cancelEditing()" [disabled]="saving">Cancelar</button>
              </td>
            </ng-template>
          </tr>
          <tr *ngIf="categories.length === 0"><td class="empty" colspan="3">Aún no hay categorías registradas.</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</section>
